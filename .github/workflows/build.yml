name: Build Telegram X Custom

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Telegram X (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f || true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Rust
        run: |
          RUST_VERSION=$(scripts/read-property.sh version.properties version.rust)
          echo "Installing Rust $RUST_VERSION..."
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustup default "$RUST_VERSION"
          echo "RUST_DIR=$(rustup show home)" >> $GITHUB_ENV

      - name: Setup Android SDK and NDK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          NDK_PRIMARY=$(scripts/read-property.sh version.properties version.ndk_primary)
          CMAKE_VER=$(scripts/read-property.sh version.properties version.cmake)
          BUILD_TOOLS_VER=$(scripts/read-property.sh version.properties version.build_tools)
          PLATFORM_VER=$(scripts/read-property.sh version.properties version.sdk_package)
          echo "Installing NDK $NDK_PRIMARY, CMake $CMAKE_VER, Build-Tools $BUILD_TOOLS_VER, Platform $PLATFORM_VER..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;$PLATFORM_VER" \
            "build-tools;$BUILD_TOOLS_VER" \
            "ndk;$NDK_PRIMARY" \
            "cmake;$CMAKE_VER"

      - name: Generate Keystore & Setup local.properties
        run: |
          keytool -genkey -v -keystore release.jks -alias tgx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass telegramx -keypass telegramx \
            -dname "CN=TelegramX, OU=TGX, O=Telegram, L=Dubai, S=Dubai, C=AE"

          cat << EOF > keystore.properties
          keystore.file=$PWD/release.jks
          keystore.password=telegramx
          key.alias=tgx
          key.password=telegramx
          EOF

          cat << EOF > local.properties
          sdk.dir=$ANDROID_HOME
          rust.dir=$RUST_DIR
          keystore.file=keystore.properties
          app.id=org.thunderdog.challegram
          app.name=Telegram X
          app.download_url=https://telegram.org/dlx
          telegram.api_id=23793598
          telegram.api_hash=273a536b9232da26405a3faa74c418f2
          tgx.extension=none
          app.experimental=false
          EOF

          echo "=== local.properties ==="
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew scripts/*.sh

      - name: Build with Gradle
        run: |
          ./gradlew :app:assembleLatestRelease \
            -Pabi=arm64 \
            --stacktrace --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC" \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pkotlin.daemon.useFallbackStrategy=false

      - name: Locate Built APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found after build!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/TelegramX-Custom-arm64.apk
          echo "apk_path=dist/TelegramX-Custom-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Telegram X Custom Native (No Ads + Hide All Chats)"
          body: |
            ### Telegram X Custom Native Build
            - **No Channel Ads**: Blocked sponsored messages at network and cache layer.
            - **No Proxy Sponsor**: Removed proxy sponsor channel pinning.
            - **Hide All Chats Tab**: Native folder-only view enabled.
            - **Free Folder Reordering**: No Telegram Premium requirement.
            - **Unrestricted Screenshots**: Allowed screenshots in secret chats and protected media.
            - **Target Architecture**: ARM64 (`arm64-v8a`)
          draft: false
          prerelease: false
          files: dist/TelegramX-Custom-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
